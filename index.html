<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, user-scalable=no, maximum-scale=1.0">
    <meta name="theme-color" content="#1e293b">
    
    <link rel="manifest" href="manifest.json">
    <link rel="apple-touch-icon" href="icons/icon-192.png">
    
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="Журнал">
    <meta name="mobile-web-app-capable" content="yes">
    
    <title>Журнал оборудования</title>
    
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }

        :root {
            --safe-top: env(safe-area-inset-top, 0px);
            --safe-bottom: env(safe-area-inset-bottom, 0px);
            --safe-left: env(safe-area-inset-left, 0px);
            --safe-right: env(safe-area-inset-right, 0px);
            --c-blue: #2563eb;
            --c-blue-light: #dbeafe;
            --c-green: #16a34a;
            --c-green-light: #dcfce7;
            --c-red: #dc2626;
            --c-red-light: #fee2e2;
            --c-gray: #64748b;
            --c-gray-light: #f1f5f9;
        }

        html, body {
            height: 100%;
            overflow: hidden;
            touch-action: pan-y;
            -webkit-text-size-adjust: 100%;
        }

        body {
            background-color: #b8c4d4;
            font-family: system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;
            color: #1e293b;
            overscroll-behavior: none;
            -webkit-user-select: none;
            user-select: none;
        }

        ::-webkit-scrollbar { width: 6px; height: 6px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background: rgba(100,116,139,0.3); border-radius: 3px; }

        /* ============== ЭКРАН ВХОДА ============== */
        .auth-screen {
            position: fixed;
            inset: 0;
            background: #b8c4d4;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 16px;
            padding-top: calc(16px + var(--safe-top));
            padding-bottom: calc(16px + var(--safe-bottom));
            z-index: 1200;
            overflow-y: auto;
        }

        .auth-card {
            background: #ffffff;
            padding: 28px 24px;
            border-radius: 28px;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.14);
            width: 100%;
            max-width: 400px;
            border: 1px solid #94a3b8;
            display: flex;
            flex-direction: column;
            gap: 14px;
            margin: auto;
        }

        .auth-card h1 { font-size: 1.4rem; font-weight: 600; color: #0f172a; }

        .auth-tabs {
            display: flex;
            background: #f1f5f9;
            border-radius: 40px;
            padding: 4px;
            gap: 4px;
        }

        .auth-tab {
            flex: 1;
            padding: 10px;
            border-radius: 40px;
            border: none;
            background: transparent;
            font-weight: 500;
            font-size: 0.9rem;
            cursor: pointer;
            color: #64748b;
            transition: 0.15s;
            font-family: inherit;
        }

        .auth-tab.active {
            background: #ffffff;
            color: #0f172a;
            box-shadow: 0 2px 6px rgba(0,0,0,0.06);
        }

        .field { display: flex; flex-direction: column; gap: 6px; position: relative; }
        .field label { font-size: 0.8rem; color: #475569; font-weight: 500; }

        .field input, .field select {
            padding: 12px 14px;
            border-radius: 12px;
            border: 1px solid #94a3b8;
            font-size: 1rem;
            background: #ffffff;
            outline: none;
            transition: 0.15s;
            font-family: inherit;
            color: #0f172a;
            min-height: 48px;
            width: 100%;
            font-size: 16px;
        }

        .field input:focus, .field select:focus {
            border-color: #475569;
            box-shadow: 0 0 0 3px rgba(71, 85, 105, 0.1);
        }

        .btn {
            padding: 12px 18px;
            border-radius: 40px;
            border: none;
            font-weight: 500;
            font-size: 0.95rem;
            cursor: pointer;
            transition: 0.15s;
            font-family: inherit;
            min-height: 48px;
        }

        .btn-primary { background: #1e293b; color: white; }
        .btn-primary:hover { background: #0f172a; }
        .btn-primary:disabled { opacity: 0.6; cursor: not-allowed; }

        .btn-outline { background: #ffffff; color: #1e293b; border: 1px solid #94a3b8; }
        .btn-outline:hover { background: #f1f5f9; }

        .btn-danger { background: #fee2e2; color: #991b1b; border: 1px solid #fca5a5; }
        .btn-danger:hover { background: #fecaca; }

        .auth-error { color: #991b1b; font-size: 0.85rem; text-align: center; min-height: 20px; }
        .auth-success { color: #166534; font-size: 0.85rem; text-align: center; min-height: 20px; }

        .autocomplete-list {
            position: absolute;
            top: calc(100% + 4px);
            left: 0;
            right: 0;
            background: #ffffff;
            border: 1px solid #94a3b8;
            border-radius: 12px;
            max-height: 200px;
            overflow-y: auto;
            z-index: 50;
            box-shadow: 0 8px 20px rgba(0, 0, 0, 0.12);
            display: none;
        }

        .autocomplete-list.open { display: block; }

        .autocomplete-item {
            padding: 12px 14px;
            cursor: pointer;
            font-size: 0.9rem;
            color: #0f172a;
        }
        .autocomplete-item:hover { background: #f1f5f9; }

        /* ============== ПРИЛОЖЕНИЕ ============== */
        .app-container {
            display: none;
            flex-direction: column;
            height: 100vh;
            height: 100dvh;
            padding-top: var(--safe-top);
            padding-left: var(--safe-left);
            padding-right: var(--safe-right);
        }

        .app-container.active { display: flex; }

        .top-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: nowrap;
            gap: 8px;
            padding: 8px 12px;
            background: #b8c4d4;
            flex-shrink: 0;
        }

        .user-greeting {
            font-size: 0.82rem;
            font-weight: 500;
            color: #0f172a;
            background: #ffffff;
            padding: 7px 12px;
            border-radius: 40px;
            border: 1px solid #94a3b8;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            max-width: 45%;
        }

        .top-actions { display: flex; gap: 6px; align-items: center; }

        .btn-icon {
            width: 40px;
            height: 40px;
            padding: 0;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1rem;
            background: #ffffff;
            color: #1e293b;
            border: 1px solid #94a3b8;
            cursor: pointer;
            font-family: inherit;
            transition: 0.15s;
        }

        .btn-icon:hover { background: #f1f5f9; }

        .search-bar {
            padding: 0 12px 10px;
            background: #b8c4d4;
            flex-shrink: 0;
        }

        .search-input {
            width: 100%;
            padding: 10px 14px;
            border: 1px solid #94a3b8;
            border-radius: 40px;
            background: #ffffff;
            font-size: 16px;
            outline: none;
            font-family: inherit;
            color: #0f172a;
            min-height: 42px;
        }

        .search-input:focus { border-color: #475569; }
        .search-input::placeholder { color: #94a3b8; }

        .grid-wrapper {
            flex: 1;
            padding: 0 12px calc(12px + var(--safe-bottom));
            overflow-y: auto;
            min-height: 0;
        }

        .departments-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            grid-template-rows: repeat(2, minmax(280px, 1fr));
            gap: 14px;
            min-height: 100%;
        }

        .dept-card {
            background: #ffffff;
            border-radius: 20px;
            padding: 12px 14px;
            box-shadow: 0 6px 14px rgba(0, 0, 0, 0.07);
            border: 1px solid #94a3b8;
            display: flex;
            flex-direction: column;
            overflow: hidden;
            transition: 0.12s;
        }

        .dept-card.drag-over {
            border-color: #1e293b;
            background: #f8fafc;
            box-shadow: 0 8px 22px rgba(0, 0, 0, 0.14);
        }

        .dept-title {
            font-size: 0.9rem;
            font-weight: 600;
            color: #1e293b;
            margin-bottom: 8px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 8px;
            border-bottom: 1px solid #e2e8f0;
            padding-bottom: 6px;
            flex-shrink: 0;
        }

        .dept-title > span:first-child {
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
        }

        .dept-count {
            font-size: 0.72rem;
            color: #475569;
            background: #e2e8f0;
            padding: 2px 8px;
            border-radius: 30px;
            flex-shrink: 0;
        }

        .equipment-list {
            display: flex;
            flex-direction: column;
            gap: 6px;
            flex: 1;
            overflow-y: auto;
            padding-right: 2px;
            min-height: 0;
        }

        .equipment-card {
            background: #ffffff;
            border: 1px solid #e2e8f0;
            border-radius: 12px;
            padding: 8px 10px;
            display: flex;
            align-items: center;
            gap: 8px;
            cursor: pointer;
            transition: 0.12s;
            user-select: none;
            flex-shrink: 0;
        }

        .equipment-card.status-working { background: #dcfce7; border-color: #86efac; }
        .equipment-card.status-broken { background: #fee2e2; border-color: #fca5a5; }
        .equipment-card.dragging { opacity: 0.35; border-style: dashed; }

        .equipment-info { flex: 1; min-width: 0; }

        .equipment-name {
            font-weight: 600;
            font-size: 0.78rem;
            color: #0f172a;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .equipment-details {
            font-size: 0.65rem;
            color: #475569;
            display: flex;
            flex-wrap: wrap;
            gap: 4px;
            margin-top: 3px;
            align-items: center;
        }

        .equipment-status {
            display: inline-block;
            padding: 1px 6px;
            border-radius: 30px;
            font-size: 0.6rem;
            font-weight: 500;
        }

        .equipment-status.working { background: #bbf7d0; color: #166534; }
        .equipment-status.broken { background: #fecaca; color: #991b1b; }

        .repair-card { background: #fef2f2; border-color: #fca5a5; }
        .repair-card.drag-over { border-color: #991b1b; background: #fee2e2; }
        .repair-card .dept-title { color: #991b1b; border-bottom-color: #fecaca; }
        .repair-card .dept-count { background: #fecaca; color: #991b1b; }

        .empty-message {
            color: #64748b;
            font-size: 0.75rem;
            font-style: italic;
            padding: 12px 0;
            text-align: center;
        }

        /* ============== МОДАЛЬНЫЕ ОКНА ============== */
        .modal-overlay {
            position: fixed;
            inset: 0;
            background: rgba(15, 23, 42, 0.55);
            backdrop-filter: blur(2px);
            display: none;
            align-items: flex-start;
            justify-content: center;
            z-index: 1100;
            padding: 8px;
            padding-top: calc(8px + var(--safe-top));
            padding-bottom: calc(8px + var(--safe-bottom));
            overflow-y: auto;
            -webkit-overflow-scrolling: touch;
        }

        .modal-overlay.open { display: flex; }

        .modal-panel {
            background: #ffffff;
            border-radius: 20px;
            box-shadow: 0 24px 48px rgba(0, 0, 0, 0.22);
            width: 100%;
            max-width: 520px;
            border: 1px solid #cbd5e1;
            display: flex;
            flex-direction: column;
            max-height: calc(100dvh - 16px - var(--safe-top) - var(--safe-bottom));
            overflow: hidden;
            margin: auto;
        }

        .modal-panel.wide { max-width: 640px; }

        /* Красивый хедер модалки */
        .modal-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 8px;
            padding: 12px 16px;
            border-bottom: 1px solid #e2e8f0;
            background: linear-gradient(180deg, #f8fafc 0%, #f1f5f9 100%);
            flex-shrink: 0;
        }

        .modal-header h2 {
            font-size: 0.95rem;
            font-weight: 600;
            color: #0f172a;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
            flex: 1;
            min-width: 0;
        }

        .modal-header-actions { display: flex; gap: 6px; flex-shrink: 0; }

        .modal-header-actions .btn {
            padding: 7px 12px;
            font-size: 0.78rem;
            min-height: 34px;
            white-space: nowrap;
        }

        .modal-body {
            padding: 16px;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 16px;
            min-height: 0;
            -webkit-overflow-scrolling: touch;
        }

        /* Секции модалки */
        .form-section {
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .form-section-title {
            font-size: 0.72rem;
            font-weight: 600;
            color: #64748b;
            text-transform: uppercase;
            letter-spacing: 0.06em;
            padding-bottom: 4px;
            border-bottom: 1px dashed #e2e8f0;
        }

        .field-row { display: flex; gap: 10px; }
        .field-row .field { flex: 1; }

        /* Красивые кнопки-чипы для локации и статуса */
        .chip-group {
            display: flex;
            flex-wrap: wrap;
            gap: 6px;
        }

        .chip {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            padding: 8px 14px;
            border-radius: 30px;
            border: 1.5px solid #cbd5e1;
            background: #f8fafc;
            font-size: 0.82rem;
            font-weight: 500;
            color: #475569;
            cursor: pointer;
            user-select: none;
            transition: 0.15s;
            font-family: inherit;
        }

        .chip:hover { background: #f1f5f9; }

        .chip.selected {
            background: #1e293b;
            color: white;
            border-color: #1e293b;
            box-shadow: 0 2px 8px rgba(30, 41, 59, 0.3);
        }

        .chip.selected.location-chip {
            background: #2563eb;
            border-color: #2563eb;
            box-shadow: 0 2px 8px rgba(37, 99, 235, 0.3);
        }

        .chip.selected.status-working {
            background: #16a34a;
            border-color: #16a34a;
            box-shadow: 0 2px 8px rgba(22, 163, 74, 0.3);
        }

        .chip.selected.status-broken {
            background: #dc2626;
            border-color: #dc2626;
            box-shadow: 0 2px 8px rgba(220, 38, 38, 0.3);
        }

        .chip.selected.status-repair {
            background: #991b1b;
            border-color: #991b1b;
            box-shadow: 0 2px 8px rgba(153, 27, 27, 0.3);
        }

        .chip-icon { font-size: 0.9rem; }

        /* Фото-блок */
        .photo-block {
            display: flex;
            gap: 12px;
            align-items: center;
            padding: 12px;
            border-radius: 14px;
            border: 1.5px dashed #cbd5e1;
            background: #f8fafc;
        }

        .photo-preview {
            width: 80px;
            height: 80px;
            border-radius: 12px;
            object-fit: cover;
            background: #e2e8f0;
            flex-shrink: 0;
            border: 1px solid #e2e8f0;
            cursor: zoom-in;
        }

        .photo-actions { display: flex; flex-direction: column; gap: 6px; flex: 1; }

        .photo-actions .btn {
            padding: 8px 12px;
            font-size: 0.8rem;
            width: 100%;
            min-height: 38px;
        }

        /* История — как мессенджер */
        .history-list { display: flex; flex-direction: column; gap: 10px; }

        .chat-msg {
            display: flex;
            gap: 10px;
            align-items: flex-start;
        }

        .chat-avatar {
            width: 34px;
            height: 34px;
            border-radius: 50%;
            background: linear-gradient(135deg, #2563eb, #1e40af);
            color: white;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: 600;
            font-size: 0.78rem;
            flex-shrink: 0;
            text-transform: uppercase;
        }

        .chat-content {
            flex: 1;
            min-width: 0;
            display: flex;
            flex-direction: column;
            gap: 4px;
        }

        .chat-meta {
            display: flex;
            align-items: center;
            gap: 8px;
            flex-wrap: wrap;
            font-size: 0.75rem;
        }

        .chat-author {
            font-weight: 600;
            color: #0f172a;
            font-size: 0.82rem;
        }

        .chat-time { font-size: 0.7rem; color: #94a3b8; }

        .chat-bubble {
            background: #f1f5f9;
            border: 1px solid #e2e8f0;
            border-radius: 4px 14px 14px 14px;
            padding: 10px 14px;
            font-size: 0.82rem;
            color: #1e293b;
            display: flex;
            flex-direction: column;
            gap: 8px;
            max-width: 100%;
            word-wrap: break-word;
        }

        .chat-bubble.type-move {
            background: #dbeafe;
            border-color: #93c5fd;
        }

        .chat-bubble.type-add {
            background: #dcfce7;
            border-color: #86efac;
        }

        .chat-bubble.type-archive {
            background: #fee2e2;
            border-color: #fca5a5;
        }

        .chat-bubble.type-edit {
            background: #f1f5f9;
            border-color: #e2e8f0;
        }

        .chat-action-title {
            font-weight: 600;
            font-size: 0.75rem;
            color: #475569;
            text-transform: uppercase;
            letter-spacing: 0.04em;
        }

        .chat-route {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            background: rgba(255, 255, 255, 0.7);
            padding: 6px 12px;
            border-radius: 20px;
            font-weight: 500;
            font-size: 0.82rem;
            align-self: flex-start;
            border: 1px solid rgba(255, 255, 255, 0.9);
        }

        .chat-route .arrow { color: #2563eb; font-weight: 700; }

        .chat-photo {
            max-width: 200px;
            max-height: 200px;
            border-radius: 10px;
            object-fit: cover;
            cursor: zoom-in;
            border: 1px solid rgba(0,0,0,0.06);
        }

        /* ============== АРХИВ ============== */
        .archive-list { display: flex; flex-direction: column; gap: 10px; }

        .archive-item {
            background: #f8fafc;
            border: 1px solid #e2e8f0;
            border-radius: 14px;
            padding: 12px 14px;
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        .archive-item-header {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            gap: 10px;
            flex-wrap: wrap;
        }

        .archive-item-name {
            font-weight: 600;
            font-size: 0.9rem;
            color: #0f172a;
        }

        .archive-item-meta {
            font-size: 0.72rem;
            color: #64748b;
            display: flex;
            flex-direction: column;
            gap: 2px;
        }

        .archive-item-info {
            font-size: 0.78rem;
            color: #475569;
        }

        /* ============== ПРОСМОТР ФОТО ============== */
        .photo-viewer {
            position: fixed;
            inset: 0;
            background: rgba(0, 0, 0, 0.94);
            display: none;
            align-items: center;
            justify-content: center;
            z-index: 2000;
            padding: 16px;
            padding-top: calc(64px + var(--safe-top));
            padding-bottom: calc(64px + var(--safe-bottom));
            touch-action: pinch-zoom;
        }

        .photo-viewer.open { display: flex; }

        .photo-viewer img {
            max-width: 100%;
            max-height: 100%;
            object-fit: contain;
            border-radius: 8px;
            user-select: none;
            -webkit-user-drag: none;
            touch-action: pinch-zoom;
        }

        .photo-viewer-close {
            position: absolute;
            top: calc(16px + var(--safe-top));
            right: 16px;
            width: 44px;
            height: 44px;
            border-radius: 50%;
            background: rgba(255, 255, 255, 0.15);
            color: white;
            border: 1px solid rgba(255, 255, 255, 0.3);
            font-size: 1.3rem;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            font-family: inherit;
        }

        .photo-viewer-close:hover { background: rgba(255, 255, 255, 0.25); }

        .toast {
            position: fixed;
            bottom: calc(20px + var(--safe-bottom));
            left: 50%;
            transform: translateX(-50%) translateY(20px);
            background: #1e293b;
            color: white;
            padding: 10px 20px;
            border-radius: 40px;
            font-size: 0.85rem;
            opacity: 0;
            pointer-events: none;
            transition: 0.25s ease;
            z-index: 1300;
            box-shadow: 0 8px 20px rgba(0,0,0,0.25);
            max-width: calc(100vw - 32px);
            text-align: center;
        }

        .toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }

        .loading-overlay {
            position: fixed;
            inset: 0;
            background: rgba(184, 196, 212, 0.8);
            backdrop-filter: blur(2px);
            display: none;
            align-items: center;
            justify-content: center;
            z-index: 1400;
        }

        .loading-overlay.show { display: flex; }

        .spinner {
            width: 44px;
            height: 44px;
            border: 4px solid rgba(30, 41, 59, 0.2);
            border-top-color: #1e293b;
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
        }

        @keyframes spin { to { transform: rotate(360deg); } }

        @media (max-width: 1024px) {
            .departments-grid {
                grid-template-columns: repeat(2, 1fr);
                grid-template-rows: repeat(3, minmax(240px, 1fr));
            }
        }

        @media (max-width: 700px) {

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
import {
    getDatabase, ref, onValue, set, update, remove, push, get
} from "https://www.gstatic.com/firebasejs/10.12.0/firebase-database.js";

const firebaseConfig = {
    apiKey: "AIzaSyAnWSB_cUZHYvIe6-iRaePcLTCygJqibXc",
    authDomain: "ed-history.firebaseapp.com",
    databaseURL: "https://ed-history-default-rtdb.firebaseio.com",
    projectId: "ed-history",
    storageBucket: "ed-history.firebasestorage.app",
    messagingSenderId: "509871642597",
    appId: "1:509871642597:web:0da8090b76c90a1da9810c"
};

const app = initializeApp(firebaseConfig);
const db = getDatabase(app);

const DEPARTMENTS = [
    'Альметьевский Цех',
    'Джалильский Цех',
    'Елховский Цех',
    'Нурлатский Цех',
    'СЦ ШГН'
];
const REPAIR = 'Ремонт';
const ALL_LOCATIONS = [...DEPARTMENTS, REPAIR];

// ======================== СОСТОЯНИЕ ========================
let equipment = [];         // метаданные, включая archived
let history = [];
let users = [];
let currentUser = null;
let draggedId = null;
let editingId = null;
let pendingMove = null;
let addPhotoData = '';
let eqPhotoData = '';
let movePhotoData = '';
let currentEqPhoto = '';
let currentSearch = '';

// Выбранные значения для чипов
let addLocationValue = DEPARTMENTS[0];
let addStatusValue = 'рабочий';
let eqLocationValue = '';
let eqStatusValue = 'рабочий';
let moveStatusValue = 'рабочий';

const $ = (id) => document.getElementById(id);

// ======================== УТИЛИТЫ ========================
function uid() {
    return Date.now().toString(36) + Math.random().toString(36).slice(2, 8);
}

function formatTime(ts) {
    const d = ts ? new Date(ts) : new Date();
    const pad = (n) => n.toString().padStart(2, '0');
    return `${pad(d.getDate())}.${pad(d.getMonth() + 1)}.${d.getFullYear()} ${pad(d.getHours())}:${pad(d.getMinutes())}`;
}

function initials(fullName) {
    if (!fullName) return '?';
    return fullName.split(' ').slice(0, 2).map(w => w[0]).join('').toUpperCase();
}

function showToast(msg) {
    const t = $('toast');
    t.textContent = msg;
    t.classList.add('show');
    clearTimeout(t._timer);
    t._timer = setTimeout(() => t.classList.remove('show'), 2400);
}

function showLoading(v) {
    $('loading').classList.toggle('show', v);
}

async function hashPassword(password) {
    const encoder = new TextEncoder();
    const data = encoder.encode(password + '_ed_salt_v1');
    const hashBuffer = await crypto.subtle.digest('SHA-256', data);
    const hashArray = Array.from(new Uint8Array(hashBuffer));
    return hashArray.map(b => b.toString(16).padStart(2, '0')).join('');
}

// Сжатие фото 800px / 0.6
function compressImage(file, maxSize = 800, quality = 0.6) {
    return new Promise((resolve, reject) => {
        const reader = new FileReader();
        reader.onload = (e) => {
            const img = new Image();
            img.onload = () => {
                const canvas = document.createElement('canvas');
                let { width, height } = img;
                if (width > height && width > maxSize) {
                    height = (height * maxSize) / width;
                    width = maxSize;
                } else if (height > maxSize) {
                    width = (width * maxSize) / height;
                    height = maxSize;
                }
                canvas.width = width;
                canvas.height = height;
                canvas.getContext('2d').drawImage(img, 0, 0, width, height);
                resolve(canvas.toDataURL('image/jpeg', quality));
            };
            img.onerror = reject;
            img.src = e.target.result;
        };
        reader.onerror = reject;
        reader.readAsDataURL(file);
    });
}

// ======================== ПРОСМОТР ФОТО ========================
function openPhotoViewer(src) {
    if (!src) return;
    $('photoViewerImg').src = src;
    $('photoViewer').classList.add('open');
}

function closePhotoViewer() {

    $('photoViewerImg').src = '';
}

    try {
        const snap = await get(ref(db, 'photos/' + id));
        return snap.val() || '';
    } catch (e) {
        console.warn('photo load error', id, e);
        return '';

}

// ======================== ЧИПЫ (локация / статус) ========================
function renderLocationChips(container, selectedValue, onSelect) {
    container.innerHTML = '';
    ALL_LOCATIONS.forEach(loc => {
        const chip = document.createElement('button');
        chip.type = 'button';
        chip.className = 'chip location-chip' + (loc === selectedValue ? ' selected' : '');
        chip.innerHTML = `<span class="chip-icon">📍</span> ${loc}`;
        chip.addEventListener('click', () => {
            container.querySelectorAll('.chip').forEach(c => c.classList.remove('selected'));
            chip.classList.add('selected');
            onSelect(loc);
        });
        container.appendChild(chip);
    });
}

function renderStatusChips(container, selectedValue, onSelect) {
    container.innerHTML = '';
    const statuses = [
        { value: 'рабочий', label: 'Рабочий', icon: '✓', cls: 'status-working' },
        { value: 'не рабочий', label: 'Не рабочий', icon: '✕', cls: 'status-broken' }
    ];
    statuses.forEach(s => {
        const chip = document.createElement('button');
        chip.type = 'button';
        chip.className = 'chip ' + s.cls + (s.value === selectedValue ? ' selected' : '');
        chip.innerHTML = `<span class="chip-icon">${s.icon}</span> ${s.label}`;
        chip.addEventListener('click', () => {
            container.querySelectorAll('.chip').forEach(c => c.classList.remove('selected'));
            chip.classList.add('selected');
            onSelect(s.value);
        });
        container.appendChild(chip);
    });
}

// ======================== ПОДПИСКИ FIREBASE ========================
function subscribeData() {
    // Только НЕархивные для главного экрана
    onValue(ref(db, 'equipment'), (snap) => {
        const val = snap.val();
        equipment = val ? Object.entries(val).map(([id, eq]) => ({ id, ...eq })) : [];
        render();
    });

    onValue(ref(db, 'history'), (snap) => {
        const val = snap.val();
        history = val ? Object.entries(val).map(([id, h]) => ({ id, ...h })) : [];
    });

    onValue(ref(db, 'users'), (snap) => {
        const val = snap.val();
        users = val ? Object.entries(val).map(([id, u]) => ({ id, ...u })) : [];
    });
}

// ======================== АВТОРИЗАЦИЯ ========================
let authMode = 'login';

function setAuthMode(mode) {
    authMode = mode;
    $('tabLogin').classList.toggle('active', mode === 'login');
    $('tabRegister').classList.toggle('active', mode === 'register');
    $('authPassword2Field').style.display = mode === 'register' ? 'flex' : 'none';
    $('authSubmit').textContent = mode === 'login' ? 'Войти' : 'Зарегистрироваться';
    $('authError').textContent = '';
    $('authSuccess').textContent = '';
}

function showAuthError(msg) { $('authError').textContent = msg; $('authSuccess').textContent = ''; }
function showAuthSuccess(msg) { $('authSuccess').textContent = msg; $('authError').textContent = ''; }

function setupAutocomplete() {
    const input = $('authName');
    const list = $('authAutocomplete');

    function hide() { list.classList.remove('open'); list.innerHTML = ''; }

    function render() {
        const q = input.value.trim().toLowerCase();
        if (!q || authMode === 'register') { hide(); return; }
        const matches = users
            .filter(u => u.fullName && u.fullName.toLowerCase().startsWith(q))
            .map(u => u.fullName);
        const uniq = [...new Set(matches)];
        if (uniq.length === 0) { hide(); return; }
        list.innerHTML = '';
        uniq.slice(0, 8).forEach(name => {
            const item = document.createElement('div');
            item.className = 'autocomplete-item';
            item.textContent = name;
            const sel = (e) => { e.preventDefault(); input.value = name; hide(); };
            item.addEventListener('mousedown', sel);
            item.addEventListener('touchstart', sel, { passive: false });
            list.appendChild(item);
        });
        list.classList.add('open');
    }

    input.addEventListener('input', render);
    input.addEventListener('focus', render);
    input.addEventListener('blur', () => setTimeout(hide, 200));
}

async function handleAuth() {
    const name = $('authName').value.trim();
    const pass = $('authPassword').value;
    const pass2 = $('authPassword2').value;

    if (!name || !pass) { showAuthError('Заполните все поля'); return; }
    $('authSubmit').disabled = true;
    try {
        if (authMode === 'register') {
            if (pass.length < 4) { showAuthError('Пароль минимум 4 символа'); return; }
            if (pass !== pass2) { showAuthError('Пароли не совпадают'); return; }
            const usersSnap = await get(ref(db, 'users'));
            const usersVal = usersSnap.val() || {};
            const exists = Object.values(usersVal).some(u => 
                u.fullName && u.fullName.toLowerCase() === name.toLowerCase()
            );
            if (exists) { showAuthError('Пользователь уже существует'); return; }

            const passHash = await hashPassword(pass);
            const newRef = push(ref(db, 'users'));
            await set(newRef, { fullName: name, passHash, createdAt: Date.now() });

            showAuthSuccess('Аккаунт создан. Входим...');
            currentUser = { id: newRef.key, fullName: name, passHash };
            setTimeout(() => enterApp(), 700);
        } else {
            const usersSnap = await get(ref(db, 'users'));
            const usersVal = usersSnap.val() || {};
            const found = Object.entries(usersVal).find(([id, u]) =>
                u.fullName && u.fullName.toLowerCase() === name.toLowerCase()
            );
            if (!found) { showAuthError('Пользователь не найден'); return; }
            const [id, user] = found;
            const passHash = await hashPassword(pass);
            if (user.passHash !== passHash) { showAuthError('Неверный пароль'); return; }
            currentUser = { id, fullName: user.fullName, passHash: user.passHash };
            enterApp();
        }
    } catch (e) {
        console.error(e);
        showAuthError('Ошибка: ' + e.message);
    } finally {
        $('authSubmit').disabled = false;
    }
}

function enterApp() {
    $('authScreen').style.display = 'none';
    $('app').classList.add('active');
    $('userGreeting').textContent = currentUser.fullName;
    subscribeData();
    localStorage.setItem('ed_session', JSON.stringify(currentUser));
}

function logout() {
    localStorage.removeItem('ed_session');
    currentUser = null;
    $('app').classList.remove('active');
    $('authScreen').style.display = 'flex';
    $('authPassword').value = '';
    $('authPassword2').value = '';
    $('authError').textContent = '';
    $('authSuccess').textContent = '';
}

// ======================== РЕНДЕР ========================
function renderEqCard(eq) {
    const card = document.createElement('div');
    card.className = 'equipment-card ' + (eq.status === 'рабочий' ? 'status-working' : 'status-broken');
    card.draggable = true;
    card.dataset.id = eq.id;

    const info = document.createElement('div');
    info.className = 'equipment-info';

    const name = document.createElement('div');
    name.className = 'equipment-name';
    name.textContent = eq.name;

    const details = document.createElement('div');
    details.className = 'equipment-details';

    const status = document.createElement('span');
    status.className = 'equipment-status ' + (eq.status === 'рабочий' ? 'working' : 'broken');
    status.textContent = eq.status;

    const params = document.createElement('span');
    params.textContent = eq.params;

    details.appendChild(status);
    details.appendChild(params);
    info.appendChild(name);
    info.appendChild(details);
    card.appendChild(info);

    card.addEventListener('dragstart', (e) => {
        draggedId = eq.id;
        card.classList.add('dragging');
        e.dataTransfer.effectAllowed = 'move';
        e.dataTransfer.setData('text/plain', eq.id);
    });
    card.addEventListener('dragend', () => {
        card.classList.remove('dragging');
        document.querySelectorAll('.drag-over').forEach(el => el.classList.remove('drag-over'));
    });
    card.addEventListener('click', () => {
        if (card.classList.contains('dragging')) return;
        openEqModal(eq.id);
    });

    return card;
}

function renderDept(deptName, list, isRepair) {
    const card = document.createElement('div');
    card.className = 'dept-card' + (isRepair ? ' repair-card' : '');

    const title = document.createElement('div');
    title.className = 'dept-title';
    const titleText = document.createElement('span');
    titleText.textContent = deptName;
    const count = document.createElement('span');
    count.className = 'dept-count';
    count.textContent = list.length;
    title.appendChild(titleText);
    title.appendChild(count);

    const listDiv = document.createElement('div');
    listDiv.className = 'equipment-list';

    if (list.length === 0) {
        const empty = document.createElement('div');
        empty.className = 'empty-message';
        empty.textContent = 'нет оборудования';
        listDiv.appendChild(empty);
    } else {
        list.forEach(eq => listDiv.appendChild(renderEqCard(eq)));
    }

    card.appendChild(title);
    card.appendChild(listDiv);

    card.addEventListener('dragover', (e) => {
        e.preventDefault();
        e.dataTransfer.dropEffect = 'move';
        card.classList.add('drag-over');
    });
    card.addEventListener('dragleave', (e) => {
        if (!card.contains(e.relatedTarget)) card.classList.remove('drag-over');
    });
    card.addEventListener('drop', (e) => {
        e.preventDefault();
        card.classList.remove('drag-over');
        if (!draggedId) return;
        const eq = equipment.find(x => x.id === draggedId);
        if (!eq || eq.location === deptName) { draggedId = null; return; }
        pendingMove = { id: draggedId, to: deptName, from: eq.location };
        draggedId = null;
        openMoveModal();
    });

    return card;
}

function render() {
    const grid = $('departmentsGrid');
    grid.innerHTML = '';

    const query = currentSearch;
    const isSearching = query.length > 0;

    // Только НЕ архивные
    const active = equipment.filter(e => !e.archived);

    const grouped = {};
    ALL_LOCATIONS.forEach(loc => grouped[loc] = []);
    active.forEach(eq => {
        const loc = grouped[eq.location] ? eq.location : REPAIR;
        grouped[loc].push(eq);
    });

    if (isSearching) {
        for (const loc in grouped) {
            grouped[loc] = grouped[loc].filter(eq => {
                const str = `${eq.name} ${eq.params} ${eq.status} ${eq.location}`.toLowerCase();
                return str.includes(query);
            });
        }
    }

    const order = [...DEPARTMENTS, REPAIR];
    let anyVisible = false;
    order.forEach(deptName => {
        const list = grouped[deptName] || [];
        const isRepair = deptName === REPAIR;

        if (isSearching && list.length === 0) {
            const emptyCell = document.createElement('div');
            emptyCell.className = 'dept-card';
            emptyCell.style.visibility = 'hidden';
            grid.appendChild(emptyCell);
            return;
        }
        anyVisible = true;
        grid.appendChild(renderDept(deptName, list, isRepair));
    });

    if (isSearching && !anyVisible) {
        const empty = document.createElement('div');
        empty.style.cssText = 'grid-column: 1 / -1; text-align:center; padding:40px; color:#64748b; font-style:italic;';
        empty.textContent = 'Ничего не найдено';
        grid.appendChild(empty);
    }
}

// ======================== МОДАЛКА ПЕРЕМЕЩЕНИЯ ========================
async function openMoveModal() {
    if (!pendingMove) return;
    const eq = equipment.find(x => x.id === pendingMove.id);
    if (!eq) return;

    movePhotoData = '';
    $('movePhotoPreview').src = 'https://placehold.co/80x80/e2e8f0/94a3b8?text=%20';
    loadPhoto(eq.id).then(data => {
        movePhotoData = data || '';
        if (data) $('movePhotoPreview').src = data;
    });

    $('moveInfo').innerHTML = `<strong>${eq.name}</strong> <span class="arrow">${pendingMove.from} → ${pendingMove.to}</span>`;

    moveStatusValue = eq.status;
    renderStatusChips($('moveStatusChips'), moveStatusValue, (v) => { moveStatusValue = v; });

    $('moveModal').classList.add('open');
}

function closeMoveModal() {
    $('moveModal').classList.remove('open');
    pendingMove = null;
    movePhotoData = '';
}

async function confirmMove() {
    if (!pendingMove) return;
    const eq = equipment.find(x => x.id === pendingMove.id);
    if (!eq) { closeMoveModal(); return; }

    const newStatus = moveStatusValue;
    const oldLocation = eq.location;
    const oldStatus = eq.status;
    const oldPhoto = await loadPhoto(eq.id);

    showLoading(true);
    try {
        await update(ref(db, 'equipment/' + eq.id), {
            location: pendingMove.to,
            status: newStatus
        });

        const photoChanged = movePhotoData && movePhotoData !== oldPhoto;
        if (photoChanged) {
            await set(ref(db, 'photos/' + eq.id), movePhotoData);
        }

        // Запись в историю
        const h1 = push(ref(db, 'history'));
        const histId = h1.key;
        await set(h1, {
            equipmentId: eq.id, equipmentName: eq.name,
            type: 'move',
            from: oldLocation, to: pendingMove.to,
            user: currentUser.fullName,
            userInitials: initials(currentUser.fullName),
            timestamp: Date.now(),
            hasPhoto: photoChanged
        });
        if (photoChanged) {
            await set(ref(db, 'historyPhoto/' + histId), movePhotoData);
        }

        if (oldStatus !== newStatus) {
            const h2 = push(ref(db, 'history'));
            await set(h2, {
                equipmentId: eq.id, equipmentName: eq.name,
                type: 'edit', field: 'status',
                oldValue: oldStatus, newValue: newStatus,
                user: currentUser.fullName,
                userInitials: initials(currentUser.fullName),
                timestamp: Date.now()
            });
        }

        showToast(`${eq.name}: ${oldLocation} → ${pendingMove.to}`);
    } catch (e) {
        console.error(e);
        showToast('Ошибка: ' + e.message);
    } finally {
        showLoading(false);
        closeMoveModal();
    }
}

// ======================== ИСТОРИЯ — МЕССЕНДЖЕР ========================
async function renderHistory(equipmentId) {
    const list = $('eqHistoryList');
    list.innerHTML = '';
    const items = history
        .filter(h => h.equipmentId === equipmentId)
        .sort((a, b) => (a.timestamp || 0) - (b.timestamp || 0));

    if (items.length === 0) {
        const empty = document.createElement('div');
        empty.className = 'empty-message';
        empty.textContent = 'нет записей';
        list.appendChild(empty);
        return;
    }

    for (const item of items) {
        const msg = document.createElement('div');
        msg.className = 'chat-msg';

        const avatar = document.createElement('div');
        avatar.className = 'chat-avatar';
        avatar.textContent = item.userInitials || initials(item.user || '?');

        const content = document.createElement('div');
        content.className = 'chat-content';

        const meta = document.createElement('div');
        meta.className = 'chat-meta';
        const author = document.createElement('span');
        author.className = 'chat-author';
        author.textContent = item.user || '—';
        const time = document.createElement('span');
        time.className = 'chat-time';
        time.textContent = formatTime(item.timestamp);
        meta.appendChild(author);
        meta.appendChild(time);

        const bubble = document.createElement('div');
        bubble.className = 'chat-bubble type-' + (item.type === 'archive' ? 'archive' : item.type);

        const actionTitle = document.createElement('div');
        actionTitle.className = 'chat-action-title';
        actionTitle.textContent = item.type === 'add' ? 'Добавлено' :
                                   item.type === 'move' ? 'Перемещено' :
                                   item.type === 'edit' ? 'Изменено' :
                                   item.type === 'archive' ? 'В архив' : 'Восстановлено';
        bubble.appendChild(actionTitle);

        if (item.type === 'move' || item.type === 'add') {
            const route = document.createElement('div');
            route.className = 'chat-route';
            if (item.type === 'move') {
                route.innerHTML = `📍 ${item.from} <span class="arrow">→</span> ${item.to}`;
            } else {
                route.innerHTML = `📍 <span class="arrow">→</span> ${item.to}`;
            }
            bubble.appendChild(route);
        } else if (item.type === 'edit') {
            const route = document.createElement('div');
            route.className = 'chat-route';
            const names = { name: 'Наименование', params: 'Параметры', location: 'Место', status: 'Статус', photo: 'Фото' };
            route.textContent = `${names[item.field] || item.field}: ${item.oldValue} → ${item.newValue}`;
            bubble.appendChild(route);
        } else if (item.type === 'archive') {
            const route = document.createElement('div');
            route.className = 'chat-route';
            route.textContent = `📦 Место: ${item.from || '—'}`;
            bubble.appendChild(route);
        }

        // Фото показываем ТОЛЬКО если оно было добавлено в этом событии
        if (item.hasPhoto) {
            const photoSnap = await get(ref(db, 'historyPhoto/' + item.id));
            const photoSrc = photoSnap.val();
            if (photoSrc) {
                const img = document.createElement('img');
                img.className = 'chat-photo';
                img.src = photoSrc;
                img.alt = '';
                img.addEventListener('click', (e) => {
                    e.stopPropagation();
                    openPhotoViewer(photoSrc);
                });
                bubble.appendChild(img);
            }
        }

        content.appendChild(meta);
        content.appendChild(bubble);
        msg.appendChild(avatar);
        msg.appendChild(content);
        list.appendChild(msg);
    }

    // Скролл вниз
    setTimeout(() => { list.scrollTop = list.scrollHeight; }, 50);
}

// ======================== МОДАЛКА ОБОРУДОВАНИЯ ========================
async function openEqModal(id) {
    const eq = equipment.find(x => x.id === id);
    if (!eq) return;

    editingId = id;
    eqPhotoData = '';
    currentEqPhoto = '';

    $('eqModalTitle').textContent = eq.name;
    $('eqName').value = eq.name;
    $('eqParams').value = eq.params;
    $('eqPhotoPreview').src = 'https://placehold.co/80x80/e2e8f0/94a3b8?text=%20';

    eqLocationValue = eq.location;
    eqStatusValue = eq.status;
    renderLocationChips($('eqLocationChips'), eqLocationValue, (v) => { eqLocationValue = v; });
    renderStatusChips($('eqStatusChips'), eqStatusValue, (v) => { eqStatusValue = v; });

    // Загружаем последнее фото
    loadPhoto(id).then(data => {
        currentEqPhoto = data || '';
        eqPhotoData = data || '';
        if (data) $('eqPhotoPreview').src = data;
    });

    renderHistory(id);
    $('equipmentModal').classList.add('open');
}

function closeEqModal() {
    $('equipmentModal').classList.remove('open');
    editingId = null;
    currentEqPhoto = '';
}

async function saveEq() {
    if (!editingId) return;
    const eq = equipment.find(x => x.id === editingId);
    if (!eq) return;

    const newName = $('eqName').value.trim();
    const newParams = $('eqParams').value.trim();
    const newLoc = eqLocationValue;
    const newStatus = eqStatusValue;
    const newPhoto = eqPhotoData;

    if (!newName) { showToast('Укажите наименование'); return; }
    if (!newParams) { showToast('Укажите параметры'); return; }

    showLoading(true);
    try {
        await update(ref(db, 'equipment/' + eq.id), {
            name: newName, params: newParams,
            location: newLoc, status: newStatus
        });

        const photoChanged = newPhoto !== currentEqPhoto;
        if (photoChanged) {
            await set(ref(db, 'photos/' + eq.id), newPhoto);
        }

        // Логи
        if (eq.location !== newLoc) {
            const r = push(ref(db, 'history'));
            await set(r, {
                equipmentId: eq.id, equipmentName: newName,
                type: 'move', from: eq.location, to: newLoc,
                user: currentUser.fullName, userInitials: initials(currentUser.fullName),
                timestamp: Date.now(),
                hasPhoto: photoChanged
            });
            if (photoChanged) await set(ref(db, 'historyPhoto/' + r.key), newPhoto);
        }
        if (eq.name !== newName) {
            const r = push(ref(db, 'history'));
            await set(r, {
                equipmentId: eq.id, equipmentName: newName,
                type: 'edit', field: 'name', oldValue: eq.name, newValue: newName,
                user: currentUser.fullName, userInitials: initials(currentUser.fullName),
                timestamp: Date.now()
            });
        }
        if (eq.params !== newParams) {
            const r = push(ref(db, 'history'));
            await set(r, {
                equipmentId: eq.id, equipmentName: newName,
                type: 'edit', field: 'params', oldValue: eq.params, newValue: newParams,
                user: currentUser.fullName, userInitials: initials(currentUser.fullName),
                timestamp: Date.now()
            });
        }
        if (eq.status !== newStatus) {
            const r = push(ref(db, 'history'));
            await set(r, {
                equipmentId: eq.id, equipmentName: newName,
                type: 'edit', field: 'status', oldValue: eq.status, newValue: newStatus,
                user: currentUser.fullName, userInitials: initials(currentUser.fullName),
                timestamp: Date.now()
            });
        }
        if (photoChanged && eq.location === newLoc && eq.name === newName && eq.params === newParams && eq.status === newStatus) {
            // Фото изменилось, но остальное нет — отдельная запись
            const r = push(ref(db, 'history'));
            await set(r, {
                equipmentId: eq.id, equipmentName: newName,
                type: 'edit', field: 'photo', oldValue: 'старое', newValue: 'новое',
                user: currentUser.fullName, userInitials: initials(currentUser.fullName),
                timestamp: Date.now(),
                hasPhoto: true
            });
            await set(ref(db, 'historyPhoto/' + r.key), newPhoto);
        }

        showToast('Сохранено');
        closeEqModal();
    } catch (e) {
        console.error(e);
        showToast('Ошибка: ' + e.message);
    } finally {
        showLoading(false);
    }
}

// ======================== АРХИВ ========================
async function archiveEq() {
    if (!editingId) return;
    const eq = equipment.find(x => x.id === editingId);
    if (!eq) return;
    if (!confirm(`Переместить "${eq.name}" в архив?`)) return;

    showLoading(true);
    try {
        await update(ref(db, 'equipment/' + eq.id), {
            archived: true,
            archivedBy: currentUser.fullName,
            archivedAt: Date.now()
        });

        const r = push(ref(db, 'history'));
        await set(r, {
            equipmentId: eq.id, equipmentName: eq.name,
            type: 'archive', from: eq.location,
            user: currentUser.fullName, userInitials: initials(currentUser.fullName),
            timestamp: Date.now()
        });

        showToast(`В архиве: ${eq.name}`);
        closeEqModal();
    } catch (e) {
        showToast('Ошибка: ' + e.message);
    } finally {
        showLoading(false);
    }
}

async function openArchiveModal() {
    renderArchive();
    $('archiveModal').classList.add('open');
}

function renderArchive() {
    const list = $('archiveList');
    list.innerHTML = '';
    const archived = equipment.filter(e => e.archived);

    if (archived.length === 0) {
        const empty = document.createElement('div');
        empty.className = 'empty-message';
        empty.textContent = 'Архив пуст';
        list.appendChild(empty);
        return;
    }

    archived.sort((a, b) => (b.archivedAt || 0) - (a.archivedAt || 0));

    archived.forEach(eq => {
        const item = document.createElement('div');
        item.className = 'archive-item';

        const header = document.createElement('div');
        header.className = 'archive-item-header';

        const nameEl = document.createElement('div');
        nameEl.className = 'archive-item-name';
        nameEl.textContent = eq.name;

        const restoreBtn = document.createElement('button');
        restoreBtn.className = 'btn btn-primary';
        restoreBtn.style.padding = '6px 14px';
        restoreBtn.style.fontSize = '0.8rem';
        restoreBtn.style.minHeight = '34px';
        restoreBtn.textContent = 'Восстановить';
        restoreBtn.addEventListener('click', () => restoreFromArchive(eq.id));

        header.appendChild(nameEl);
        header.appendChild(restoreBtn);

        const info = document.createElement('div');
        info.className = 'archive-item-info';
        info.textContent = `${eq.params} · было: ${eq.location} · ${eq.status}`;

        const meta = document.createElement('div');
        meta.className = 'archive-item-meta';
        const delBy = document.createElement('div');
        delBy.textContent = `🗄 Удалил: ${eq.archivedBy || '—'}`;
        const delAt = document.createElement('div');
        delAt.textContent = `🕐 ${formatTime(eq.archivedAt)}`;
        meta.appendChild(delBy);
        meta.appendChild(delAt);

        item.appendChild(header);
        item.appendChild(info);
        item.appendChild(meta);
        list.appendChild(item);
    });
}

async function restoreFromArchive(id) {
    const eq = equipment.find(x => x.id === id);
    if (!eq) return;

    showLoading(true);
    try {
        await update(ref(db, 'equipment/' + eq.id), {
            archived: false,
            archivedBy: null,
            archivedAt: null,
            restoredBy: currentUser.fullName,
            restoredAt: Date.now()
        });

        const r = push(ref(db, 'history'));
        await set(r, {
            equipmentId: eq.id, equipmentName: eq.name,
            type: 'restore', to: eq.location,
            user: currentUser.fullName, userInitials: initials(currentUser.fullName),
            timestamp: Date.now()
        });

        showToast(`Восстановлено: ${eq.name}`);
        renderArchive();
    } catch (e) {
        showToast('Ошибка: ' + e.message);
    } finally {
        showLoading(false);
    }
}

// ======================== МОДАЛКА ДОБАВЛЕНИЯ ========================
function openAddModal() {
    addPhotoData = '';
    $('addName').value = '';
    $('addParams').value = '';
    $('addPhotoPreview').src = 'https://placehold.co/80x80/e2e8f0/94a3b8?text=%20';

    addLocationValue = DEPARTMENTS[0];
    addStatusValue = 'рабочий';
    renderLocationChips($('addLocationChips'), addLocationValue, (v) => { addLocationValue = v; });
    renderStatusChips($('addStatusChips'), addStatusValue, (v) => { addStatusValue = v; });

    $('addModal').classList.add('open');
    setTimeout(() => $('addName').focus(), 200);
}

function closeAddModal() { $('addModal').classList.remove('open'); }

async function saveAdd() {
    const name = $('addName').value.trim();
    const params = $('addParams').value.trim();

    if (!name) { showToast('Укажите наименование'); return; }
    if (!params) { showToast('Укажите параметры'); return; }

    showLoading(true);
    try {
        const newRef = push(ref(db, 'equipment'));
        const id = newRef.key;
        await set(newRef, {
            name, params,
            location: addLocationValue,
            status: addStatusValue,
            archived: false,
            createdAt: Date.now(),
            createdBy: currentUser.fullName
        });

        if (addPhotoData) {
            await set(ref(db, 'photos/' + id), addPhotoData);
        }

        const r = push(ref(db, 'history'));
        await set(r, {
            equipmentId: id, equipmentName: name,
            type: 'add', to: addLocationValue,
            user: currentUser.fullName, userInitials: initials(currentUser.fullName),
            timestamp: Date.now(),
            hasPhoto: !!addPhotoData
        });
        if (addPhotoData) {
            await set(ref(db, 'historyPhoto/' + r.key), addPhotoData);
        }

        showToast(`Добавлено: ${name}`);
        closeAddModal();
    } catch (e) {
        showToast('Ошибка: ' + e.message);
    } finally {
        showLoading(false);
    }
}

// ======================== ФОТО ========================
function setupPhoto(inputId, btnId, galleryBtnId, previewId, callback) {
    const input = $(inputId);
    const btn = $(btnId);
    const galleryBtn = $(galleryBtnId);
    const preview = $(previewId);

    btn.addEventListener('click', () => {
        input.setAttribute('capture', 'environment');
        input.click();
    });
    galleryBtn.addEventListener('click', () => {
        input.removeAttribute('capture');
        input.click();
    });
    input.addEventListener('change', async (e) => {
        const file = e.target.files[0];
        if (!file) return;
        try {
            const dataUrl = await compressImage(file, 800, 0.6);
            callback(dataUrl);
            preview.src = dataUrl;
        } catch (err) {
            console.error(err);
            showToast('Ошибка обработки фото');
        }
        input.value = '';
    });

    preview.style.cursor = 'zoom-in';
    preview.addEventListener('click', () => {
        if (preview.src && !preview.src.startsWith('https://placehold.co')) {
            openPhotoViewer(preview.src);
        }
    });
}

// ======================== ИНИЦИАЛИЗАЦИЯ ========================
function init() {
    // Запрет pinch-zoom на iOS через gesturestart
    document.addEventListener('gesturestart', (e) => {
        if (!$('photoViewer').classList.contains('open')) e.preventDefault();
    });
    // Запрет double-tap zoom
    let lastTouch = 0;
    document.addEventListener('touchend', (e) => {
        const now = Date.now();
        if (now - lastTouch <= 300 && !e.target.closest('.photo-viewer')) {
            e.preventDefault();
        }
        lastTouch = now;
    }, { passive: false });

    $('tabLogin').addEventListener('click', () => setAuthMode('login'));
    $('tabRegister').addEventListener('click', () => setAuthMode('register'));

    setupAutocomplete();
    $('authSubmit').addEventListener('click', handleAuth);
    $('authName').addEventListener('keypress', (e) => { if (e.key === 'Enter') $('authPassword').focus(); });
    $('authPassword').addEventListener('keypress', (e) => { if (e.key === 'Enter') authMode === 'register' ? $('authPassword2').focus() : handleAuth(); });
    $('authPassword2').addEventListener('keypress', (e) => { if (e.key === 'Enter') handleAuth(); });

    $('searchInput').addEventListener('input', (e) => {
        currentSearch = e.target.value.trim().toLowerCase();
        render();
    });

    $('addBtn').addEventListener('click', openAddModal);
    $('archiveBtn').addEventListener('click', openArchiveModal);
    $('logoutBtn').addEventListener('click', () => { if (confirm('Выйти?')) logout(); });

    $('addCancelBtn').addEventListener('click', closeAddModal);
    $('addSaveBtn').addEventListener('click', saveAdd);
    $('eqCancelBtn').addEventListener('click', closeEqModal);
    $('eqSaveBtn').addEventListener('click', saveEq);
    $('eqArchiveBtn').addEventListener('click', archiveEq);
    $('moveCancelBtn').addEventListener('click', closeMoveModal);
    $('moveConfirmBtn').addEventListener('click', confirmMove);
    $('archiveCloseBtn').addEventListener('click', () => $('archiveModal').classList.remove('open'));

    $('photoViewerClose').addEventListener('click', closePhotoViewer);
    $('photoViewer').addEventListener('click', (e) => {
        if (e.target === $('photoViewer')) closePhotoViewer();
    });

    document.querySelectorAll('.modal-overlay').forEach(overlay => {
        overlay.addEventListener('click', (e) => {
            if (e.target === overlay) {
                overlay.classList.remove('open');
                if (overlay.id === 'equipmentModal') { editingId = null; currentEqPhoto = ''; }
                if (overlay.id === 'moveModal') { pendingMove = null; movePhotoData = ''; }
            }
        });
    });

    document.addEventListener('keydown', (e) => {
        if (e.key === 'Escape') {
            if ($('photoViewer').classList.contains('open')) { closePhotoViewer(); return; }
            document.querySelectorAll('.modal-overlay.open').forEach(m => m.classList.remove('open'));
            editingId = null; pendingMove = null; movePhotoData = ''; currentEqPhoto = '';
        }
    });

    setupPhoto('addPhotoInput', 'addPhotoBtn', 'addPhotoGalleryBtn', 'addPhotoPreview', (d) => { addPhotoData = d; });
    setupPhoto('eqPhotoInput', 'eqPhotoBtn', 'eqPhotoGalleryBtn', 'eqPhotoPreview', (d) => { eqPhotoData = d; });
    setupPhoto('movePhotoInput', 'movePhotoBtn', 'movePhotoGalleryBtn', 'movePhotoPreview', (d) => { movePhotoData = d; });

    document.addEventListener('dragover', (e) => e.preventDefault());
    document.addEventListener('drop', (e) => {
        if (!e.target.closest('.dept-card')) {
            draggedId = null;
            document.querySelectorAll('.drag-over').forEach(el => el.classList.remove('drag-over'));
        }
    });

    // Подписка users для автодополнения до входа
    onValue(ref(db, 'users'), (snap) => {
        const val = snap.val();
        users = val ? Object.entries(val).map(([id, u]) => ({ id, ...u })) : [];
    });

    // Восстановление сессии
    const saved = localStorage.getItem('ed_session');
    if (saved) {
        try {
            const s = JSON.parse(saved);
            if (s && s.fullName) {
                currentUser = s;
                $('authScreen').style.display = 'none';
                $('app').classList.add('active');
                $('userGreeting').textContent = currentUser.fullName;
                subscribeData();
            }
        } catch (e) { console.warn('session restore failed', e); }
    }

    if ('serviceWorker' in navigator) {
        navigator.serviceWorker.register('sw.js').catch(err => console.warn('SW error', err));
    }
}

init();
